telegram:
  chat_id: "@your_channel"       # TELEGRAM_CHAT_ID in .env overrides
  thread_id: null                # forum topic id; TELEGRAM_THREAD_ID in .env overrides
  owner_user_id: 0               # your Telegram user id; commands answer only you
  admin_chat_id: ""              # private chat for alerts, never the channel

schedule:
  timezone: Asia/Singapore
  # quiet 21:00 to 05:00 SGT: the trading desk runs the US session then (21:30 to 04:00, 22:30 to 05:00 in winter)
  collect_cron: "7 5 * * *"      # once a day, before the 08:30 market card
  discover_cron: "30 5 * * *"   # claude -p web search, once a day
  lesson_cron: "0 8 * * *"
  market_cron: "30 8 * * *"      # daily market card for the watchlist

run:
  deals_per_alert: 10
  move_alert_pct: 5
  min_comparables: 5
  asking_to_sale_discount: 0.95
  too_good_pct: 30
  stop_loss_pct: 10
  quick_sale_discount_pct: 5
  service_age_years: 6
  comparables_days: 30           # window of asking prices for market value
  trim_pct: 10                   # trimmed median drops this share at each end
  ended_after_missed_runs: 2     # a listing missing from this many complete collects in a row has ended
  max_run_minutes: 90

costs:
  insurance_pct: 1.0             # insured courier when not collected in person
  payment_fee_pct: 1.0
  authentication_sgd: 150
  service_reserve_sgd: {Rolex: 1200, Omega: 900, Tudor: 700, Cartier: 800, Grand Seiko: 800, default: 600}
  sell_fees_pct: {local_private: 0, consignment: 15, dealer_buyback: 0, online_platform: 7}   # sources in rules.yaml
  dealer_buyback_discount_pct: 15   # dealers pay below market
  local_delivery_sgd: 25

limits:
  web:
    per_domain_min_gap_seconds: 8
    per_domain_max_gap_seconds: 15
    max_requests_per_day: 120
    chrono24_pages_per_day: 20
    domain_cooldown_hours: 24
    respect_robots_txt: true
    user_agent: "watchbot/1.0 (personal research, low volume)"
    timeout_seconds: 25
    max_bytes: 2000000
    page_cache_hours: 20         # a page fetched this recently is served from the cache, no request
    failures_before_cooldown: 3
  daily_calls_ebay: 1000
  ebay_min_gap_seconds: 1.0
  daily_calls_watchcharts: 100
  daily_calls_fx: 4
  telegram: {min_gap_seconds: 3.5, max_per_minute: 17, max_retry_after_seconds: 900}
  claude: {max_calls_per_day: 8}    # 5 discoveries + 1 lesson + headroom

claude:
  binary: claude
  model: haiku                   # every claude -p call runs on haiku (the owner, 2026-10-03)
  fallback_model: haiku          # equal to model, so no --fallback-model flag is passed
  discover_model: haiku
  max_retries: 2                 # CLAUDE_CODE_MAX_RETRIES
  timeout_seconds: 900
  discover_max_turns: 40
  write_max_turns: 3

never_fetch_domains: [carousell.sg, carousell.com, facebook.com, instagram.com, reddit.com, xiaohongshu.com]

sources:
  sg_dealers: {enabled: true}
  ebay: {enabled: true, item_location: SG, marketplace_id: EBAY_SG, category_id: "31387", page_size: 200}
  chrono24: {enabled: true, seller_country: SG}
  watchcharts: {enabled: false}
  fx: {url: "https://api.frankfurter.dev/v1/latest", currencies: [USD, EUR, HKD, CHF, GBP, JPY, MYR, AUD]}

region:
  country: SG
  allowed_tlds: [.sg]
  allow_non_sg_domains_only_for_sg_sellers: true
